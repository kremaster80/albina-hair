<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Albina CRM — рабочий кабинет</title><link rel="stylesheet" href="/admin/crm.css"><script src="/admin/crm.js" defer></script></head>
<body><div class="layout"><aside class="sidebar"><a class="mark" href="/admin/crm.html">ALBINA<span>.</span><small>STUDIO CRM</small></a><nav aria-label="Разделы кабинета"><button data-view="leads" class="active">Заявки</button><button data-view="clients">Клиенты</button><button data-view="bookings">Записи</button><button data-view="stats">Статистика</button><a href="/admin/">Подключения</a></nav><div class="side-bottom"><span>Личный кабинет</span><button id="logout">Выйти</button></div></aside>
<main><header class="topbar"><div><span class="eyebrow">ALBINA HAIR / MANAGEMENT</span><h1 id="heading">Заявки</h1></div><button class="primary" id="add">+ Новая заявка</button></header>
<div id="notice" role="status" hidden></div><section class="metrics" id="metrics" aria-label="Сводка"></section>
<section class="content"><div class="toolbar"><div><h2 id="section-title">Все обращения</h2><p id="section-note">Новые клиенты и история общения.</p></div><button id="refresh" class="ghost">Обновить</button></div>
<div id="filters" class="filters"><label class="search"><span>Поиск</span><input id="search" placeholder="Имя, телефон, сообщение" autocomplete="off"></label><label id="state-filter">Статус<select id="status"><option value="">Все статусы</option><option value="new">Новая</option><option value="working">В работе</option><option value="booked">Записан</option><option value="closed">Закрыта</option></select></label><label id="source-filter">Источник<select id="source"><option value="">Все каналы</option><option value="instagram">Instagram</option><option value="whatsapp">WhatsApp</option><option value="telegram">Telegram</option><option value="website">Сайт</option><option value="dikidi">DIKIDI</option><option value="yandex">Яндекс</option><option value="2gis">2ГИС</option><option value="google">Google</option><option value="manual">Вручную</option></select></label></div>
<div id="results" aria-live="polite"></div><div class="pagination" id="pagination" hidden><button id="prev" class="ghost">Назад</button><span id="page"></span><button id="next" class="ghost">Далее</button></div></section><footer>ALBINA STUDIO · личный кабинет <span>DIKIDI — основная система онлайн-записи</span></footer></main></div>
<dialog id="detail"><div class="dialog-head"><div><span class="eyebrow" id="dialog-kicker">КАРТОЧКА</span><h2 id="dialog-title">Заявка</h2></div><button id="close" class="close" aria-label="Закрыть">×</button></div><div id="dialog-body"></div><p id="dialog-error" role="alert"></p></dialog></body></html>
