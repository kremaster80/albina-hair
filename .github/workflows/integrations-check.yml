name: Integrations API checks

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'server/**'
      - '.github/workflows/integrations-check.yml'
  push:
    branches:
      - feature/integrations-dashboard
      - fix/telegram-long-polling

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: albina_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: albina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node syntax
        run: |
          node --check server/integrations.mjs
          node --test server/instagram-unified.test.mjs
          node --test server/whatsapp-signup.test.mjs
          node --check admin/admin.js
          node --check admin/crm.js
          node --check server/crm.mjs
          node --check server/telegram.mjs
          node --check server/telegram-polling.mjs
          node --test server/telegram-polling.test.mjs
          node --check server/crm.test.mjs
          node --check server/smoke.test.mjs
      - name: Run local API smoke tests
        run: node server/smoke.test.mjs

      - name: Install CRM dependencies
        run: npm --prefix server install --ignore-scripts
      - name: Test actual PostgreSQL integration
        env:
          DATABASE_URL: postgresql://albina_test:test_only@127.0.0.1:5432/albina_test
          CRM_TEST_DATABASE: '1'
        run: node server/crm.test.mjs
